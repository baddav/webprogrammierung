<!doctype html>
<html lang="de">
<head>
    <meta charset="utf-8">
    <title>Pokedex – PokeGallery</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <!-- Verknüpfung mit der CSS Datei -->
    <link href="/public/css/styles.css" rel="stylesheet">
</head>
<body data-page="gallery">
<!-- Navigationsleiste oben auf der Seite -->
<nav class="nav">
    <!-- Linker Bereich der Navigation: Logo + Startlink -->
    <div class="left logo">
        <img src="/public/img/pokeball.svg" alt="Pokeball">
        <a href="/">Pokedex</a>
    </div>
    <!-- Mittlerer Bereich: Hauptnavigation -->
    <div class="center">
        <a href="/">PokeSearch</a>
        <a href="/gallery">PokeGallery</a>
        <a href="/collection">PokeCollection</a>
    </div>
    <!-- Rechter Bereich: Profil-Link -->
    <div class="right">
        <a href="/profile">PokeProfile</a>
    </div>
</nav>
<!-- Erster Container: Filter- und Sortierfunktion -->
<div class="container">
    <div class="card" style="display:flex; gap:12px; align-items:center; flex-wrap:wrap">
        <!-- Auswahlfeld für den Pokemon Typ -->
        <label>Filter Typ:
            <select id="type">
                <option value="">Alle</option>
                <option>fire</option><option>water</option><option>grass</option><option>electric</option>
                <option>bug</option><option>normal</option><option>poison</option><option>ground</option>
                <option>fairy</option><option>ice</option><option>fighting</option><option>psychic</option>
                <option>rock</option><option>ghost</option><option>dragon</option><option>steel</option><option>dark</option><option>flying</option>
            </select>
        </label>
        <!-- Auswahlfeld für die Sortierung-->
        <label>Sortieren:
            <select id="sort">
                <option value="name_asc">Name (A–Z)</option>
                <option value="name_desc">Name (Z–A)</option>
                <option value="atk_asc">Attack (↑)</option>
                <option value="atk_desc">Attack (↓)</option>
            </select>
        </label>
    </div>
</div>
<!-- Zweiter Container: Galerie mit Seitennavigation -->
<div class="container">
    <!-- Navigation zwischen den Seiten -->
    <div class="pager">
        <button class="btn" id="prev">Zurück</button>
        <div id="pageinfo">Seite 1</div>
        <button class="btn" id="next">Weiter</button>
    </div>
    <!-- Grid-Container für die Pokémon-Kacheln -->
    <div id="grid" class="grid"></div>
    <!-- Bereich für Zusatzinformationen/Details -->
    <div id="detail" style="margin-top:20px"></div>
</div>
<!-- Einbindung JavaScript-Code -->
<script src="/public/js/main.js"></script>

<!-- Popup-Fenster, das beim Klick auf ein Pokémon geöffnet wird -->
<div id="popup" class="popup hidden">
    <div class="popup-content">
        <!-- Schließen-Button -->
        <button id="closePopup" class="close-btn">✕</button>
        <div id="popup-detail"></div>
    </div>
</div>
</body>
</html>
