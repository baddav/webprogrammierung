<!doctype html>
<html lang="de">
<head>
    <meta charset="utf-8">
    <title>Pokedex – PokeProfile</title>

    <!-- Flexible Skalierung für verschiedene Bildschirmgrößen  -->
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Verknüpfung mit CSS-Datei-->
    <link href="/public/css/styles.css" rel="stylesheet">
</head>
<body data-page="profile">

<!-- Navigationsleiste oben auf der Seite-->
<nav class="nav">

    <!-- Linker Bereich der Navigation mit Logo und Smartlink -->
    <div class="left logo">
        <img src="/public/img/pokeball.svg" alt="Pokeball">
        <a href="/">Pokedex</a>
    </div>

    <!-- Mittlerer Bereich Hauptnavigation (Verlinkungen) -->
    <div class="center">
        <a href="/">PokeSearch</a>
        <a href="/gallery">PokeGallery</a>
        <a href="/collection">PokeCollection</a>
    </div>

    <!-- Rechter Bereich Profil-Link (Der Vollständigkeit auch hier angeführt-->
    <div class="right">
        <a href="/profile">PokeProfile</a>
    </div>
</nav>

<!-- Container für die strukturierte Darstellung der Elemente auf der Profil-Seite -->
<div class="container">

    <!-- Karte für die 3 an geführten Statistiken -->
    <div class="card" style="display:grid; gap:12px; grid-template-columns: repeat(3, 1fr);">

        <!-- Kachel für die gesammelten Pokemon (favorisierten Pokemon) -->
        <div class="tile">
            <div style="font-weight:700">Gesammelte Pokémon</div>
            <div id="stat-favs" style="font-size:28px; font-weight:800">0</div>
            <!-- id = "stats-favs" erlaubt Änderungen durch JavaScript-->
        </div>

        <!-- Kachel für die geladenen Pokemon (Gespeicherte Pokemon in der Datenbank/Abrufbare Pokemon)  -->
        <div class="tile">
            <div style="font-weight:700">Geladene Pokémon</div>
            <div id="stat-seen" style="font-size:28px; font-weight:800">0</div>
        </div>

        <!-- Kachel für den häufigsten Pokemon-Typ der favorisierten Pokemon -->
        <div class="tile">
            <div style="font-weight:700">Häufigster Typ</div>
            <div id="stat-type" style="font-size:22px; font-weight:800; text-transform:capitalize">-</div>
        </div>
    </div>
</div>

<!-- Einbinden des JavaScript Codes -->
<script src="/public/js/main.js"></script>
</body>
</html>
